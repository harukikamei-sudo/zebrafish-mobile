name: PR Checks

# 最低限の健全性チェック(型が通る・GAS が構文エラーでない)を機械的に保証する。
# mainへのマージ＝EAS Update 自動配信(全員のアプリへ即反映)なので、
# - pull_request: マージ前の検証(基本はこちらを通す)
# - push(main): 直接 push された場合の事後検知用セーフティネット
# 配信本体は eas-update.yml(push main)が担い、本ワークフローは検証のみ。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    name: Typecheck & GAS syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Code.gs syntax check
        run: |
          cp src/sync/Code.gs /tmp/code_gs_check.js
          node --check /tmp/code_gs_check.js
